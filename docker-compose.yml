version: '3.9'

services:
  app:
    build: .
    ports:
      - '${PORT:-7000}:7000'
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME:-starter_db}
      MYSQL_USER: ${DATABASE_USER:-admin}
      MYSQL_PASSWORD: ${DATABASE_PASS:-admin123}
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASS:-root123}
    ports:
      - '${DATABASE_PORT:-3306}:3306'
    volumes:
      - db_data:/var/lib/mysql
      - ./db/migrations.sql:/docker-entrypoint-initdb.d/migrations.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db_data:
